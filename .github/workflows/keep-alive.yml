name: Keep Kerf Delay Copilot Awake
on:
  schedule:
    - cron: "0 0 * * *" # Pings once a day at midnight UTC
  workflow_dispatch: # Allows you to run it manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: curl -s -o /dev/null -w "%{http_code}" https://sahib6509-kerf-delay-copilot-api.hf.space
